spring:
  datasource:
    url: jdbc:shardingsphere:absolutepath:${user.dir}/config/shardingsphere-jdbc.yml
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
  thymeleaf:
    mode: LEGACYHTML5 #去除thymeleaf的html严格校验thymeleaf.mode=LEGACYHTML5
    cache: false # 是否开启模板缓存，默认true,建议在开发时关闭缓存,不然没法看到实时

  # 将所有数字转为 String 类型返回，避免前端数据精度丢失的问题
  jackson:
    generator:
      write-numbers-as-strings: true
  #上传文件的最大值（100M）
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
#  banner:
#    charset: utf-8
#  messages:
#    encoding: UTF-8

mybatis:
  configuration:
    #自动将数据库带下划线的表字段值映射到Java类的驼峰字段上
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mybatis/mapping/*.xml
  type-aliases-package: com.java2nb.novel.entity

logging:
  config: classpath:logback-boot.xml

# 运行时调整日志级别：GET/POST /actuator/loggers（生产请限制网络访问或仅本机）
management:
  endpoints:
    web:
      exposure:
        include: health,loggers

pagehelper:
  helper-dialect: mysql

# 业务缓存（CacheService）：guava 本地内存（默认，可不启 Redis）| redis
# keep-redis-autoconfig=true 时仍加载 Spring Data Redis（novel-admin 后台 Shiro 等依赖，须开启）
novel:
  cache:
    impl: guava
    keep-redis-autoconfig: false


